<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Antigravity multi-radial mesh over vivid Google Blue base -->
    <linearGradient id="ag-blue-base" x1="50%" y1="10%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#2F80FF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="ag-green-glow" cx="31%" cy="38%" r="30%">
      <stop offset="0%" stop-color="#34C759" stop-opacity="1"/>
      <stop offset="55%" stop-color="#34A853" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#34A853" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag-yellow-glow" cx="50%" cy="13%" r="26%">
      <stop offset="0%" stop-color="#FACC15" stop-opacity="1"/>
      <stop offset="52%" stop-color="#FB923C" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag-red-glow" cx="67%" cy="28%" r="26%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#EA4335" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#EA4335" stop-opacity="0"/>
    </radialGradient>

    <!-- Codex indigo-violet soft cloud gradient -->
    <linearGradient id="cx-cloud" x1="28%" y1="6%" x2="72%" y2="96%">
      <stop offset="0%" stop-color="#D8CCFF"/>
      <stop offset="30%" stop-color="#7B7DF8"/>
      <stop offset="68%" stop-color="#4A4AF4"/>
      <stop offset="100%" stop-color="#2628E8"/>
    </linearGradient>
    <radialGradient id="cx-cloud-hi" cx="44%" cy="16%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#C4B5FD" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="cloud-shadow" x="-18%" y="-18%" width="136%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#1E1B4B" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Antigravity flared rainbow A-arch canopying above Codex -->
  <g>
    <path d="M13 88 C23 76 34 45 45 23 C51 11.5 57.5 8 64 8 C70.5 8 77 11.5 83 23 C94 45 105 76 115 88 C119 92.5 114.5 98 108 94.5 C96 88 89 67 80 55.5 C75 49 70 46 64 46 C58 46 53 49 48 55.5 C39 67 32 88 20 94.5 C13.5 98 9 92.5 13 88 Z" fill="url(#ag-blue-base)"/>
    <path d="M13 88 C23 76 34 45 45 23 C51 11.5 57.5 8 64 8 C70.5 8 77 11.5 83 23 C94 45 105 76 115 88 C119 92.5 114.5 98 108 94.5 C96 88 89 67 80 55.5 C75 49 70 46 64 46 C58 46 53 49 48 55.5 C39 67 32 88 20 94.5 C13.5 98 9 92.5 13 88 Z" fill="url(#ag-green-glow)"/>
    <path d="M13 88 C23 76 34 45 45 23 C51 11.5 57.5 8 64 8 C70.5 8 77 11.5 83 23 C94 45 105 76 115 88 C119 92.5 114.5 98 108 94.5 C96 88 89 67 80 55.5 C75 49 70 46 64 46 C58 46 53 49 48 55.5 C39 67 32 88 20 94.5 C13.5 98 9 92.5 13 88 Z" fill="url(#ag-red-glow)"/>
    <path d="M13 88 C23 76 34 45 45 23 C51 11.5 57.5 8 64 8 C70.5 8 77 11.5 83 23 C94 45 105 76 115 88 C119 92.5 114.5 98 108 94.5 C96 88 89 67 80 55.5 C75 49 70 46 64 46 C58 46 53 49 48 55.5 C39 67 32 88 20 94.5 C13.5 98 9 92.5 13 88 Z" fill="url(#ag-yellow-glow)"/>
  </g>

