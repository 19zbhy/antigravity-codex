  <g filter="url(#cloud-shadow)">
    <path d="M47 75.5 C47.5 66.2 55 59 64.2 59 C71.8 59 78.2 63.8 80.2 70.6 C87.2 71.4 92.5 77.2 92.5 84.4 C92.5 91.2 87.6 96.8 81.2 98.0 C79.0 104.5 73.0 109 65.8 109 C60.5 109 55.8 106.5 52.8 102.6 C50.8 103.3 48.6 103.8 46.2 103.8 C38.4 103.8 32 97.4 32 89.5 C32 82.4 37.2 76.5 44.0 75.4 C45.0 75.3 46.0 75.3 47 75.5 Z" fill="url(#cx-cloud)"/>
    <path d="M47 75.5 C47.5 66.2 55 59 64.2 59 C71.8 59 78.2 63.8 80.2 70.6 C87.2 71.4 92.5 77.2 92.5 84.4 C92.5 91.2 87.6 96.8 81.2 98.0 C79.0 104.5 73.0 109 65.8 109 C60.5 109 55.8 106.5 52.8 102.6 C50.8 103.3 48.6 103.8 46.2 103.8 C38.4 103.8 32 97.4 32 89.5 C32 82.4 37.2 76.5 44.0 75.4 C45.0 75.3 46.0 75.3 47 75.5 Z" fill="url(#cx-cloud-hi)"/>
    <path d="M49.5 80.5 L58.5 87.5 L49.5 94.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="65" y1="94.5" x2="77.5" y2="94.5" stroke="#FFFFFF" stroke-width="5.2" stroke-linecap="round"/>
  </g>
</svg>
